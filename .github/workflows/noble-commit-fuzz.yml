name: Fuzz Noble commit

on:
  workflow_call:
    inputs:
      ref:
        description: Noble git ref or commit to fuzz (defaults to the caller's commit)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ github.event.repository.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out Noble commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          path: noble-source
          persist-credentials: false

      - name: Check out Cryptofuzz
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: cryptofuzz
          persist-credentials: false

      - name: Select Noble adapter
        id: project
        working-directory: cryptofuzz
        env:
          ADAPTERS_ROOT: ${{ github.workspace }}/cryptofuzz/modules
          NOBLE_SOURCE_ROOT: ${{ github.workspace }}/noble-source
          PROJECT_NAME: ${{ github.event.repository.name }}
        run: ./tools/select-noble-adapter.py

      - name: Record Noble revision
        id: source
        working-directory: noble-source
        run: |
          source_sha="$(git rev-parse HEAD)"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Fuzz target: $source_sha"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: cryptofuzz/.node-version
          cache: npm
          cache-dependency-path: |
            noble-source/package-lock.json
            cryptofuzz/modules/${{ steps.project.outputs.module }}/package-lock.json

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libboost-dev

      - name: Build Noble commit
        working-directory: noble-source
        run: |
          npm ci
          npm run build

      - name: Test selected adapter
        working-directory: cryptofuzz
        env:
          NOBLE_MODULE: ${{ steps.project.outputs.module }}
          NOBLE_SOURCE_DIR: ${{ github.workspace }}/noble-source
        run: |
          make -C "modules/$NOBLE_MODULE" ids.js
          npm --prefix "modules/$NOBLE_MODULE" ci
          npm --prefix "modules/$NOBLE_MODULE" test

      - name: Build selected fuzzer
        working-directory: cryptofuzz
        env:
          NOBLE_MODULE: ${{ steps.project.outputs.module }}
          NOBLE_SOURCE_DIR: ${{ github.workspace }}/noble-source
        run: ./build.sh noble

      - name: Generate random seed
        id: seed
        shell: bash
        run: |
          seed="$(od -An -N4 -tu4 /dev/urandom)"
          seed="${seed//[[:space:]]/}"
          if [[ "$seed" == 0 ]]; then
            seed=1
          fi
          echo "value=$seed" >> "$GITHUB_OUTPUT"
          echo "Using libFuzzer seed $seed"

      - name: Fuzz for two hours
        working-directory: cryptofuzz
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          FUZZ_MAX_LEN: ${{ steps.project.outputs.max_len }}
          FUZZ_SEED: ${{ steps.seed.outputs.value }}
          NOBLE_MODULE: ${{ steps.project.outputs.module }}
          NOBLE_REPOSITORY: ${{ github.repository }}
          NOBLE_SOURCE_PACKAGE: ${{ steps.project.outputs.source_package }}
          NOBLE_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./tools/run-noble-fuzz.sh

      - name: Upload fuzzing artifacts and corpus
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.project.outputs.module }}-${{ steps.source.outputs.sha }}-${{ github.run_attempt }}
          path: |
            cryptofuzz/fuzz-artifacts/
            cryptofuzz/fuzz-corpus/
            cryptofuzz/fuzz-corpus-argon2/
            cryptofuzz/fuzz-corpus-pairing/
            cryptofuzz/fuzz-corpus-slh-dsa/
          if-no-files-found: ignore
          retention-days: 14
