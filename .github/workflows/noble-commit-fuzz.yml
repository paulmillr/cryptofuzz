name: Fuzz Noble commit

on:
  workflow_call:
    inputs:
      ref:
        description: Noble git ref or commit to fuzz (defaults to the caller's commit)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ github.event.repository.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out Noble commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          path: noble-source
          persist-credentials: false

      - name: Check out noblefuzz
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: fuzzer
          persist-credentials: false

      - name: Select Noble project
        id: project
        working-directory: fuzzer
        env:
          NOBLEFUZZ_ROOT: ${{ github.workspace }}/fuzzer/noblefuzz
          NOBLE_SOURCE_ROOT: ${{ github.workspace }}/noble-source
          PROJECT_NAME: ${{ github.event.repository.name }}
        run: node ./noblefuzz/select-project.mjs

      - name: Record Noble revision
        id: source
        working-directory: noble-source
        run: |
          source_sha="$(git rev-parse HEAD)"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Fuzz target: $source_sha"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: fuzzer/.node-version
          cache: npm
          cache-dependency-path: |
            noble-source/package-lock.json
            fuzzer/noblefuzz/package-lock.json

      - name: Build Noble commit
        working-directory: noble-source
        run: |
          npm ci
          npm run build

      - name: Install and test noblefuzz
        working-directory: fuzzer
        env:
          NOBLE_PROJECT: ${{ steps.project.outputs.module }}
          NOBLE_SOURCE_DIR: ${{ github.workspace }}/noble-source
        run: |
          npm --prefix noblefuzz ci
          env -u NOBLE_PROJECT -u NOBLE_SOURCE_DIR npm --prefix noblefuzz test
          node noblefuzz/test-project.mjs "$NOBLE_PROJECT"

      - name: Generate 256-bit random seed
        id: seed
        shell: bash
        run: |
          while true; do
            seed="$(od -An -N32 -tx1 /dev/urandom)"
            seed="0x${seed//[[:space:]]/}"
            [[ ! "$seed" =~ ^0x0+$ ]] && break
          done
          echo "value=$seed" >> "$GITHUB_OUTPUT"
          echo "Using fuzzing seed $seed"

      - name: Fuzz with noblefuzz for two hours
        working-directory: fuzzer
        env:
          FUZZ_MAX_LEN: ${{ steps.project.outputs.max_len }}
          FUZZ_SEED: ${{ steps.seed.outputs.value }}
          NOBLEFUZZ_WORKERS: auto
          NOBLE_MODULE: ${{ steps.project.outputs.module }}
          NOBLE_REPOSITORY: ${{ github.repository }}
          NOBLE_SOURCE_DIR: ${{ github.workspace }}/noble-source
          NOBLE_SOURCE_PACKAGE: ${{ steps.project.outputs.source_package }}
          NOBLE_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: ./noblefuzz/run.sh

      - name: Upload fuzzing artifacts and corpus
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.project.outputs.module }}-${{ steps.source.outputs.sha }}-${{ github.run_attempt }}
          path: |
            fuzzer/fuzz-artifacts/
            fuzzer/fuzz-corpus/
            fuzzer/fuzz-corpus-digest/
            fuzzer/fuzz-corpus-kdfs/
            fuzzer/fuzz-corpus-argon2/
            fuzzer/fuzz-corpus-pairing/
            fuzzer/fuzz-corpus-slh-dsa/
          if-no-files-found: ignore
          retention-days: 14
