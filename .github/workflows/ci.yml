name: noblefuzz CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  noblefuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: noblefuzz/package-lock.json
      - name: Install noblefuzz
        run: npm --prefix noblefuzz ci
      - name: Test noblefuzz
        run: npm --prefix noblefuzz test
      - name: Smoke-test all Noble projects
        shell: bash
        run: |
          for project in noble-hashes noble-ciphers noble-curves noble-post-quantum noble-secp256k1 noble-ed25519; do
            node noblefuzz/test-project.mjs "$project"
          done
