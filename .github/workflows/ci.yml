name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  noble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: modules/noble-*/package-lock.json
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libboost-dev
      - name: Test Noble adapters
        run: make test-noble
      - name: Build Noble fuzzer
        run: ./build.sh noble
      - name: Smoke-test fuzzer
        run: ASAN_OPTIONS=detect_leaks=0 ./cryptofuzz -runs=100

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check locked Rust adapters
        run: ./test-rust.sh

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: modules/golang/go.sum
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libboost-dev
      - name: Build Go adapter
        run: make -C modules/golang clean all
